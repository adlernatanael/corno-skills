  <!-- Ear -->
  <path fill="#0a0a0a" d="M104 84 C114 78 126 82 130 92 C120 95 110 93 104 88 Z"/>
  <!-- Near horn -->
  <path fill="#0a0a0a" d="M84 88 C58 84 34 68 28 38 C44 58 66 68 94 74 Z"/>
  <!-- Tail -->
  <path fill="#0a0a0a" d="M346 100 C362 114 366 144 360 176 L368 186 L354 184 C358 156 354 124 340 106 Z"/>
